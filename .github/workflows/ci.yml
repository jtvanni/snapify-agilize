name: CI

on: [push, pull_request]

env:
  DATABASE_URL: "postgresql://snapify_prisma:placeholder@localhost:5432/postgres?schema=snapify"
  DIRECT_URL: "postgresql://snapify_prisma:placeholder@localhost:5432/postgres?schema=snapify"
  AWS_ENDPOINT: "https://mmsskyvdparwnrwlwsrj.storage.supabase.co/storage/v1/s3"
  AWS_REGION: "sa-east-1"
  AWS_KEY_ID: "123"
  AWS_SECRET_ACCESS_KEY: "123"
  AWS_BUCKET_NAME: "snapify-videos"
  NEXTAUTH_URL: "http://localhost:3000/"
  NEXTAUTH_SECRET: "5feaf48"
  GITHUB_ID: "abc"
  GITHUB_SECRET: "abc"
  ALLOWED_EMAILS: "account@e2e.net"
  CRON_SECRET: "ci-secret-at-least-16-characters"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
